<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mama Qadeer Memorial Library</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3f8;
      color: #222;
    }

    header {
      background: #32104f;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    nav {
      background: white;
      padding: 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    nav a {
      margin: 0 12px;
      text-decoration: none;
      color: #32104f;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 18px;
    }

    .search {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .book {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .book h3 {
      color: #32104f;
      margin-top: 0;
    }

    .book p {
      color: #555;
      line-height: 1.5;
    }

    .request {
      background: #32104f;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .status {
      text-align: center;
      margin: 20px 0;
      color: #666;
    }

    footer {
      margin-top: 40px;
      background: #32104f;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>MAMA QADEER MEMORIAL LIBRARY</h1>
  <p>Baloch Students Council</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#books">Books</a>
  <a href="#about">About</a>
</nav>

<div class="container">

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search books..."
  >

  <div id="status" class="status">Loading books...</div>

  <div id="books" class="books"></div>

  <section id="about" style="margin-top:40px;">
    <h2>About Library</h2>
    <p>
      Mama Qadeer Memorial Library is a student-focused library
      created to provide students with easy access to books and
      educational resources.
    </p>
  </section>

</div>

<footer>
  © 2026 Mama Qadeer Memorial Library
</footer>

<script>
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_URL = https://nrnfgitjcbsywtljikol.supabase.co/rest/v1/
const SUPABASE_KEY = sb_publishable_BreVMKGxz_0lOll7Wya-dQ_Z23O6OXi

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allBooks = [];

async function loadBooks() {

  const { data, error } = await supabaseClient
    .from("books")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    document.getElementById("status").textContent =
      "Books could not be loaded.";
    console.error(error);
    return;
  }

  allBooks = data || [];
  displayBooks(allBooks);
}

function displayBooks(books) {

  const container = document.getElementById("books");
  const status = document.getElementById("status");

  container.innerHTML = "";

  if (books.length === 0) {
    status.textContent = "No books added yet.";
    return;
  }

  status.textContent = books.length + " book(s) available.";

  books.forEach(book => {

    const div = document.createElement("div");
    div.className = "book";

    div.innerHTML = `
      <h3>${book.title || "Untitled Book"}</h3>
      <p><strong>Author:</strong> ${book.author || "Unknown"}</p>
      <p><strong>Category:</strong> ${book.category || "General"}</p>
      <p>${book.description || "No description available."}</p>
      <button class="request" onclick="requestBook('${book.id}')">
        Request Book
      </button>
    `;

    container.appendChild(div);
  });
}

document.getElementById("search").addEventListener("input", function() {

  const searchText = this.value.toLowerCase();

  const filtered = allBooks.filter(book =>
    (book.title || "").toLowerCase().includes(searchText) ||
    (book.author || "").toLowerCase().includes(searchText) ||
    (book.category || "").toLowerCase().includes(searchText)
  );

  displayBooks(filtered);
});

function requestBook(id) {
  alert("Book request system will be added next.");
}

loadBooks();

</script>

</body>
</html>
